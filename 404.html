<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Chaitanya Wine Bar &amp; Restaurant</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('chaitanya-theme');
                var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
            } catch (error) {
                document.documentElement.dataset.theme = 'light';
            }
        }());
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-family: var(--font-serif);
            font-size: clamp(6rem, 18vw, 10rem);
            font-weight: 400;
            font-style: italic;
            color: var(--ink);
            opacity: 0.12;
            line-height: 1;
        }
        .error-message {
            font-family: var(--font-serif);
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 500;
            margin: 1rem 0 0.75rem;
            color: var(--ink);
        }
        .error-desc {
            color: var(--stone);
            font-weight: 300;
            margin-bottom: 2.5rem;
        }
    </style>
</head>
<body>
    <main class="error-page">
        <div>
            <p class="error-code">404</p>
            <h1 class="error-message">This page has wandered off</h1>
            <p class="error-desc">The page you are looking for doesn't exist or has been moved.</p>
            <a href="index.html" class="btn btn-primary btn-lg">Return home</a>
        </div>
    </main>
</body>
</html>
